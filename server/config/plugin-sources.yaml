# 插件抓取源配置 — crawler.py 读取此文件
#
# 用法:
#   python server/crawler.py --list     # 查看所有源
#   python server/crawler.py             # 执行所有启用的源
#   python server/crawler.py --source qwen-mm  # 只执行匹配的源
#   python server/crawler.py --dry-run   # 只分析+构建不发布
#   python server/crawler.py --daily     # 每日配额模式（发布满 quota 个即停，默认 10）
#   python server/crawler.py --add <url> --add-name my-plugin --add-tags ai,mcp
#
# 定时调度（两种方式）:
#   1. 内置调度（推荐）：server/app.py 启动时自动开每日调度线程（默认凌晨 3 点，
#      每日发布 10 个）。env 可调：
#        AGENTBUDDY_CRAWL_ENABLED=0   关闭
#        AGENTBUDDY_CRAWL_HOUR=3      执行时刻（0-23）
#        AGENTBUDDY_CRAWL_QUOTA=10    每日发布配额
#   2. crontab（备用）:
#      0 3 * * * cd /path/to/AgentBuddy/server && python crawler.py --daily >> /var/log/agentbuddy-crawler.log 2>&1
#
# 注：crawler 会把一个来源聚合成一个可安装插件，插件内包含多个 skills。
#     GitHub 来源会自动扫描仓库内所有 SKILL.md。
#     文章/公众号 URL 如果抓不到正文，可配置 repos/github_repos/repositories 作为仓库种子，
#     crawler 会扫描这些仓库并聚合发现的 skills。
#     skills 为可选白名单；配置时必须使用 SKILL.md frontmatter 里的权威全名
#     （如 qwen-mm-plugins-core，不是 core），否则过滤会落空。
#
# LLM 兜底（文章/URL 抓不到真实 SKILL.md 时用 AI 生成候选 skills）：
#   - ai: true 开启 LLM 分析；需要在同一 source 下配置 llm 直配项。
#   - llm 配置直接写 OpenAI-compatible 的 base_url / api_key / model，
#     crawler 不会去读 config/llm/llm.yaml，只认这里写的值。
#     llm:
#       base_url: https://api.example.com/v1
#       api_key: sk-xxxxxxxx
#       model: gpt-4o-mini
#   - 微信公众号文章建议加 ai: true，因为公众号正文常被风控拦截，
#     只有标题/摘要能稳定抓到，需要 LLM 按摘要推断候选 skills。
#
# 发布：crawler 必须与 app.py 同机部署，自动走"服务端直连"（免登录直写库和
#     packages/，首跑自动创建 crawler 服务账号）。

sources:
  - name: qwen-mm-plugins
    url: https://github.com/QwenLM/Qwen-MM-Plugins
    skills: [qwen-mm-plugins-core, qwen-mm-plugins-api, qwen-mm-plugins-search]
    tags: [multimodal, vision, ocr]
    enabled: true
    schedule: daily

  - name: anthropic-skills
    url: https://github.com/anthropics/skills
    tags: [skills, official, documents]
    enabled: true
    schedule: daily

  - name: superpowers
    url: https://github.com/obra/superpowers
    tags: [skills, workflow, devtools]
    enabled: true
    schedule: daily

  - name: awesome-mcp-servers
    url: https://github.com/punkpeye/awesome-mcp-servers
    type: directory
    tags: [mcp, directory]
    enabled: false
    schedule: weekly

  # 示例：RSS / 技术博客源（需 AI 分析，当前未启用）
  # - name: mcp-weekly
  #   url: https://example.com/feed.xml
  #   type: rss
  #   enabled: false
  #   schedule: weekly

