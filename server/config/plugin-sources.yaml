# 插件抓取源配置 — CrawlerAgent + BuildAgent 双智能体架构
#
# 架构：
#   CrawlerAgent（搜索智能体）：tasks.intent → LLM 生成查询词 → 多源聚合搜索
#                                （Tavily 网页 + GitHub API 仓库）→ 抓正文
#                                → 文章评级 → LLM 抽 skills → 写 spec.yaml
#   BuildAgent（构建智能体）：读 spec.yaml（按 rating 降序）→ build_plugin 打 zip → 发布
#
# CLI（PluginMarketWorker.py）：
#   python PluginMarketWorker.py --crawler-agent                # 跑全部 CrawlerAgent 任务（产出 spec）
#   python PluginMarketWorker.py --crawler-agent <name>         # 跑指定任务
#   python PluginMarketWorker.py --build-agent                  # 读 spec 构建 + 发布
#   python PluginMarketWorker.py --build-agent --dry-run        # 读 spec 只构建不发布
#   python PluginMarketWorker.py --list                         # 列出所有任务及状态
#
# 定时调度（两种方式）:
#   1. 内置调度（推荐）：server/app.py 启动时自动开每日调度线程（默认凌晨 3 点，
#      串联 CrawlerAgent + BuildAgent，发布满 quota 个即停）。env 可调：
#        AGENTBUDDY_CRAWL_ENABLED=0   关闭
#        AGENTBUDDY_CRAWL_HOUR=3      执行时刻（0-23）
#        AGENTBUDDY_CRAWL_QUOTA=50    每日发布配额
#   2. crontab（备用）:
#      # 凌晨 3 点跑 CrawlerAgent（产出 spec）
#      0 3 * * * cd /path/to/AgentBuddy/server && python PluginMarketWorker.py --crawler-agent >> /var/log/agentbuddy-crawler-agent.log 2>&1
#      # 凌晨 4 点跑 BuildAgent（读 spec 构建 + 发布）
#      0 4 * * * cd /path/to/AgentBuddy/server && python PluginMarketWorker.py --build-agent >> /var/log/agentbuddy-build-agent.log 2>&1
#
# 环境变量（独立应用，不读 config/llm/llm.yaml 与 config/mcp/mcp.yaml）：
#   OPENAI_API_KEY     必填（OpenAI 兼容 LLM，用于生成查询词 / 抽 skills）
#   OPENAI_BASE_URL    可选（默认 https://api.openai.com/v1）
#   OPENAI_MODEL       可选（默认 gpt-4o-mini）
#   TAVILY_API_KEY     必填（Tavily 网页搜索，独立 MCP 凭据）
#   GITHUB_TOKEN       可选（GitHub API 搜索，无 token 60 次/小时，有 5000 次/小时）
#
# 启动检查：PluginMarketWorker.py --crawler-agent 启动时校验上述环境变量，缺失则提示退出。
#
# 发布：crawler 必须与 app.py 同机部署，自动走"服务端直连"（免登录直写库和
#     packages/，首跑自动创建 crawler 服务账号）。

# ============================================================
# 固定渠道池 — 所有 CrawlerAgent 任务共享
# ============================================================
# 字段说明：
#   id      渠道标识（任务里通过 channels.id 引用）
#   domain  渠道域名（Tavily site: 过滤用）
#   name    渠道中文名
#   weight  渠道权重（0-20，文章评级用；github/zhihu 等高质量社区权重高，wechat 风控高降权）
channels:
  - {id: github,      domain: github.com,       name: GitHub,     weight: 20}
  - {id: zhihu,       domain: zhihu.com,        name: 知乎,        weight: 18}
  - {id: juejin,      domain: juejin.cn,        name: 掘金,        weight: 15}
  - {id: csdn,        domain: csdn.net,         name: CSDN,       weight: 12}
  - {id: bilibili,    domain: bilibili.com,     name: 哔哩哔哩,    weight: 12}
  - {id: youtube,     domain: youtube.com,      name: YouTube,    weight: 10}
  - {id: xiaohongshu, domain: xiaohongshu.com,  name: 小红书,      weight: 8}
  - {id: wechat,      domain: mp.weixin.qq.com, name: 微信公众号,  weight: 5}

# ============================================================
# CrawlerAgent 任务列表
# ============================================================
# 字段说明：
#   name          任务名（必填，去重/CLI 模糊匹配用）
#   intent        搜索意图（必填）：latest(最新) / trending(热门) / recommend(综合推荐)
#   channels      限定的渠道 id 列表（可选，引用上方 channels.id；留空=全部）
#   max_results   每个查询词的返回结果数（默认 10）
#   min_rating    文章评级阈值（0-100，默认 40）；低于阈值的文章跳过，不抽 skills 不写 spec
#   enabled       是否启用
#   schedule      调度频率（仅文档用，实际由 cron 控制）
#
# 查询词由 LLM 按 intent 生成（如 trending → "热门 Claude Code skills 推荐"，
# "best MCP skills this month" 等），再交由 Tavily + GitHub API 聚合搜索。
# tags 字段已移除：spec.yaml 的标签由 LLM 抽 skills 时按文章内容自动生成。
tasks:
  - name: skills-daily
    intent: trending      # latest(最新) / trending(热门) / recommend(综合推荐)
    channels: [github, zhihu, juejin, wechat, csdn]  # 留空=全部渠道
    max_results: 15
    min_rating: 40
    enabled: true
    schedule: daily

  # 示例：未启用，留作模板
