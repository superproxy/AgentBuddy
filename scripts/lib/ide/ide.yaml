      uninstall_cmd_win: "npm uninstall -g @tencent-ai/codebuddy-code 2>nul & del /q \"%APPDATA%\\npm\\codebuddy\" \"%APPDATA%\\npm\\codebuddy.cmd\" \"%APPDATA%\\npm\\codebuddy.ps1\" 2>nul & exit /b 0"
    app_install:
      # CodeBuddy IDE（独立桌面应用，产品+设计+研发一体化）
      method: system_uninstall
      url: https://www.codebuddy.cn/ide/
      uninstall_cmd_mac: "rm -rf '/Applications/CodeBuddy.app' ~/.codebuddy 2>/dev/null; true"
      uninstall_cmd_win: "rmdir /s /q \"%LOCALAPPDATA%\\Programs\\CodeBuddy\" 2>nul & rmdir /s /q \"%USERPROFILE%\\.codebuddy\" 2>nul & exit /b 0"
    vscode_install:
      # VS Code 扩展：Tencent Cloud CodeBuddy
      method: extension
      url: vscode:extension/TencentCloudCodeBuddy.codebuddy-vscode
      extension_id: TencentCloudCodeBuddy.codebuddy-vscode
      note: 点击安装将在 VS Code 中打开扩展页面（腾讯云代码助手）
    idea_install:
      # JetBrains 插件：腾讯云代码助手
      method: extension
      url: jetbrains://plugin/24778
      extension_id: "24778"
      note: 点击安装将在 JetBrains IDE 中打开插件安装页面（腾讯云代码助手）
    download_urls:
      macos_arm64: https://www.codebuddy.cn/ide/
      macos_x64: https://www.codebuddy.cn/ide/
      windows_x64: https://www.codebuddy.cn/ide/
      linux_x64: https://www.codebuddy.cn/ide/
    install_methods: [npm, app, vscode, jetbrains]
    brand: CodeBuddy
    category: code
    forms: [cli, app, vscode, idea]


# ============================================================
# detect_meta: IDE 检测元数据
# ============================================================
# 每个 IDE 定义：
#   cli_names：CLI 命令名列表（按优先级，shutil.which 探测）
#   cli_tui_names：cli_names 中属于 TUI 交互式应用的成员
#   macos_apps：macOS .app 路径列表
#   windows_apps：Windows GUI exe 路径列表（支持 {ProgramFiles} {ProgramFiles(x86)} {LOCALAPPDATA} {APPDATA} 占位）
#   config_dirs：配置目录列表（相对 Path.home()）
#   sessions_subdir：会话子目录名
#   is_tui：CLI 是否为交互式 TUI 应用
#   protocols：该 IDE 支持的 LLM 协议列表（openaiv1/anthropic），用于 sync 时过滤
detect_meta:
  Claude:
    label: Claude Code
    cli_names: [claude]
    macos_apps: ["/Applications/Claude.app"]
    windows_apps: []
    config_dirs: [".claude"]
    sessions_subdir: projects
    is_tui: true
    protocols: [openaiv1, anthropic]

  Codex:
    label: Codex
    cli_names: [codex]
    macos_apps: ["/Applications/Codex.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/codex/Codex.exe"
      - "{LOCALAPPDATA}/Programs/Codex/Codex.exe"
    config_dirs: [".codex"]
    sessions_subdir: sessions
    is_tui: true
    protocols: [responses]

  Cursor:
    label: Cursor
    # agent 是 Cursor CLI（TUI 交互式 agent），cursor 是 GUI 启动器
    cli_names: [agent]
    cli_tui_names: [agent]
    macos_apps: ["/Applications/Cursor.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/cursor/Cursor.exe"
      - "{ProgramFiles}/Cursor/Cursor.exe"
      - "{ProgramFiles(x86)}/Cursor/Cursor.exe"
    config_dirs: [".cursor"]
    sessions_subdir: acp-sessions
    is_tui: false
    protocols: [openaiv1]

  Trae:
    label: Trae
    cli_names: []
    macos_apps: ["/Applications/Trae.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/Trae/Trae.exe"
      - "{ProgramFiles}/Trae/Trae.exe"
    config_dirs: [".trae"]
    sessions_subdir: sessions
    is_tui: false
    protocols: [openaiv1]

  TraeCN:
    label: Trae CN
    # traecli/trae-cli 是 TUI code agent（CLI），独立安装于 ~/.local/bin 或 %LOCALAPPDATA%\trae-cli\bin\
    cli_names: [traecli, trae-cli]
    cli_tui_names: [traecli, trae-cli]
    macos_apps: ["/Applications/Trae CN.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/Trae CN/Trae CN.exe"
      - "{LOCALAPPDATA}/Programs/Trae CN/Trae.exe"
      - "{LOCALAPPDATA}/trae-cli/bin/trae-cli.exe"
      - "{ProgramFiles}/Trae CN/Trae CN.exe"
    config_dirs: [".trae-cn", ".traecn"]
    sessions_subdir: memory/projects
    is_tui: false
    protocols: [openaiv1]

  TraeSoloCN:
