    download_urls:
      macos_arm64: https://www.trae.ai/download
      macos_x64: https://www.trae.ai/download
      windows_x64: https://www.trae.ai/download
      linux_x64: https://www.trae.ai/download
    install_methods: [app]
    brand: Trae
    category: code
