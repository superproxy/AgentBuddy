  Copilot:
    # GitHub Copilot（GitHub 官方 AI 编程助手）
    # 官网：https://github.com/features/copilot
    # 三种形态：CLI（copilot-cli）、Desktop App（GitHub Copilot App）、VS Code 扩展
    # 来源：
    #   - CLI: https://github.com/features/copilot/cli
    #   - App: https://github.com/features/ai/github-app
    #   - VS Code: https://github.com/features/copilot/ai-code-editor
    label: GitHub Copilot
    version: latest
    release_date: "2026-07-01"
    homepage: https://github.com/features/copilot
    docs_url: https://docs.github.com/en/copilot
    release_url: https://github.com/github/copilot-sdk/releases
    cli_install:
      # npm 安装：npm install -g @github/copilot
      # brew 安装：brew install copilot-cli
      method: npm
      package: "@github/copilot"
      url: https://github.com/features/copilot/cli
      uninstall_cmd_mac: "npm uninstall -g @github/copilot 2>/dev/null; brew uninstall copilot-cli 2>/dev/null; rm -f ~/.local/bin/copilot; true"
      uninstall_cmd_win: "npm uninstall -g @github/copilot 2>nul & del /q \"%APPDATA%\\npm\\copilot\" \"%APPDATA%\\npm\\copilot.cmd\" \"%APPDATA%\\npm\\copilot.ps1\" 2>nul & exit /b 0"
    app_install:
      # GitHub Copilot App（桌面应用，macOS/Windows/Linux）
      method: system_uninstall
      url: https://github.com/features/ai/github-app
      uninstall_cmd_mac: "rm -rf '/Applications/GitHub Copilot.app' ~/.copilot 2>/dev/null; true"
      uninstall_cmd_win: "rmdir /s /q \"%LOCALAPPDATA%\\Programs\\GitHub Copilot\" 2>nul & rmdir /s /q \"%USERPROFILE%\\.copilot\" 2>nul & exit /b 0"
    vscode_install:
      # Copilot in VS Code（vscode:extension 深链一键安装）
      method: extension
      url: vscode:extension/GitHub.copilot
      extension_id: GitHub.copilot
      note: "点击安装将在 VS Code 中打开 GitHub Copilot 扩展页面"
    idea_install:
      # JetBrains 插件（Marketplace ID: 17718, xmlId: com.github.copilot）
      # 命令行安装：idea installPlugins com.github.copilot
      # 来源：https://plugins.jetbrains.com/plugin/17718-github-copilot
      method: jetbrains_cli
      plugin_id: "com.github.copilot"
      url: https://plugins.jetbrains.com/plugin/17718-github-copilot
      note: "JetBrains 插件（xmlId: com.github.copilot），支持 idea installPlugins 命令行安装"
    acp_install:
      # ACP 模式（Agent Client Protocol）：通过 copilot-language-server --acp 启动
      # 使 JetBrains AI Assistant / Zed 等 ACP 客户端能调用 Copilot
      # 来源：https://www.npmjs.com/package/@github/copilot-language-server
      method: cli
      url: https://agentclientprotocol.com/
      cmd: "npx -y @github/copilot-language-server@latest --acp"
      note: "ACP 模式：npx -y @github/copilot-language-server@latest --acp（写入 ~/.jetbrains/acp.json）"
    download_urls:
      macos_arm64: https://github.com/features/ai/github-app
      macos_x64: https://github.com/features/ai/github-app
      windows_x64: https://github.com/features/ai/github-app
      linux_x64: https://github.com/features/ai/github-app
    install_methods: [npm, brew, app, vscode, idea, acp]
    brand: Copilot
    category: code
    forms: [cli, app, vscode, idea, acp]

