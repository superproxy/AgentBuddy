      - "/Applications/Kimi.app"
    windows_apps:
      - "{LOCALAPPDATA}/Programs/Kimi Work/Kimi Work.exe"
      - "{LOCALAPPDATA}/Programs/Kimi/Kimi.exe"
      - "{ProgramFiles}/Kimi Work/Kimi Work.exe"
    config_dirs: [".kimi-work"]
    sessions_subdir: sessions
    is_tui: false
    protocols: [openaiv1]

  ZCode:
    # 智谱 ZCode ADE（Agent Development Environment）
    label: ZCode
    cli_names: [zcode]
    macos_apps: ["/Applications/ZCode.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/ZCode/ZCode.exe"
      - "{ProgramFiles}/ZCode/ZCode.exe"
    config_dirs: [".zcode"]
    sessions_subdir: cli/rollout
    is_tui: true
    protocols: [openaiv1, anthropic]

  Pi:
    # Pi（极简 agent harness，CLI 工具）
    label: Pi
    cli_names: [pi]
    macos_apps: []
    windows_apps: []
    config_dirs: [".pi"]
    sessions_subdir: sessions
    is_tui: true
    protocols: [openaiv1]

  CommandCode:
    # Command Code（面向命令行场景的 AI 编程智能体）
    label: Command Code
    cli_names: [commandcode, command-code]
    macos_apps: []
    windows_apps: []
    config_dirs: [".commandcode"]
    sessions_subdir: sessions
    is_tui: true
    protocols: [openaiv1]

  VSCode:
    label: VSCode
    # code 命令随 VSCode App 安装
    cli_names: [code]
    macos_apps: ["/Applications/Visual Studio Code.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/Microsoft VS Code/Code.exe"
      - "{ProgramFiles}/Microsoft VS Code/Code.exe"
    config_dirs: [".vscode"]
    is_tui: false
    protocols: [openaiv1]

  Copilot:
    label: GitHub Copilot
    # CLI: copilot 命令（npm @github/copilot 或 brew copilot-cli）
    cli_names: [copilot]
    # ACP 进程：npx @github/copilot-language-server --acp（通过 ~/.jetbrains/acp.json 注册）
    acp_commands: ["npx -y @github/copilot-language-server@latest --acp"]
    # App: GitHub Copilot.app（桌面应用）
    macos_apps: ["/Applications/GitHub Copilot.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/GitHub Copilot/GitHub Copilot.exe"
      - "{ProgramFiles}/GitHub Copilot/GitHub Copilot.exe"
    # JetBrains 插件 xmlId（用于 idea installPlugins 命令行安装）
    jetbrains_plugin_id: "com.github.copilot"
    config_dirs: [.copilot, .config/gh, .jetbrains]
    is_tui: false

  Cline:
    label: Cline
    # CLI: cline 命令（npm i -g cline，需 Node.js 20+）
    cli_names: [cline]
    # ACP 进程：npx cline acp（通过 ~/.jetbrains/acp.json 注册）
    acp_commands: ["npx -y cline@latest acp"]
    # JetBrains 插件 xmlId（用于 idea installPlugins 命令行安装）
    jetbrains_plugin_id: "cline"
    # VS Code 扩展 ID
    vscode_extension_id: "saoudrizwan.claude-dev"
    config_dirs: [.cline, .jetbrains]
    sessions_subdir: sessions
    is_tui: true

  CodeBuddy:
    label: CodeBuddy CN
    # CLI: CodeBuddy Code 真 CLI（npm @tencent-ai/codebuddy-code 全局安装，命令 codebuddy，交互式 TUI）。
    #   注意：CN 版 App 自带的 buddycn（软链到 ~/.codebuddy/bin/buddycn）是 App 桌面版的启动封装，
    #   打开的是桌面 App 而非交互式 CLI，因此不作为 CLI 检测。
    cli_names: [codebuddy]
    # App: CodeBuddy IDE（独立桌面应用）。CN 版 App 名为 "CodeBuddy CN.app"，国际版为 "CodeBuddy.app"
    macos_apps: ["/Applications/CodeBuddy CN.app", "/Applications/CodeBuddy.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/CodeBuddy/CodeBuddy.exe"
      - "{ProgramFiles}/CodeBuddy/CodeBuddy.exe"
    config_dirs: [.codebuddy, .codebuddy-code]
    sessions_subdir: sessions
    is_tui: true
    protocols: [openaiv1, anthropic]
