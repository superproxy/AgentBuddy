    forms: [cli, app, vscode, idea, remote]


# ============================================================
# detect_meta: IDE 检测元数据
# ============================================================
# 每个 IDE 定义：
#   cli_names：CLI 命令名列表（按优先级，shutil.which 探测）
#   cli_tui_names：cli_names 中属于 TUI 交互式应用的成员
#   macos_apps：macOS .app 路径列表
#   windows_apps：Windows GUI exe 路径列表（支持 {ProgramFiles} {ProgramFiles(x86)} {LOCALAPPDATA} {APPDATA} 占位）
#   config_dirs：配置目录列表（相对 Path.home()）
#   sessions_subdir：会话子目录名
#   is_tui：CLI 是否为交互式 TUI 应用
#   protocols：该 IDE 支持的 LLM 协议列表（openaiv1/anthropic），用于 sync 时过滤
detect_meta:
  CherryStudio:
    label: Cherry Studio
    cli_names: []
    macos_apps: ["/Applications/Cherry Studio.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/Cherry Studio/Cherry Studio.exe"
      - "{ProgramFiles}/Cherry Studio/Cherry Studio.exe"
    config_dirs: [".cherrystudio"]
    is_tui: false
    protocols: [openaiv1, anthropic]

  Claude:
    label: Claude Code
    cli_names: [claude]
    macos_apps: ["/Applications/Claude.app"]
    windows_apps: []
    config_dirs: [".claude"]
    sessions_subdir: projects
    is_tui: true
    protocols: [openaiv1, anthropic]

  Codex:
    label: Codex
    cli_names: [codex]
    macos_apps: ["/Applications/Codex.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/codex/Codex.exe"
      - "{LOCALAPPDATA}/Programs/Codex/Codex.exe"
    config_dirs: [".codex"]
    sessions_subdir: sessions
    is_tui: true
    protocols: [responses]

  Cursor:
    label: Cursor
    # agent 是 Cursor CLI（TUI 交互式 agent），cursor 是 GUI 启动器
    cli_names: [agent]
    cli_tui_names: [agent]
    macos_apps: ["/Applications/Cursor.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/cursor/Cursor.exe"
      - "{ProgramFiles}/Cursor/Cursor.exe"
      - "{ProgramFiles(x86)}/Cursor/Cursor.exe"
    config_dirs: [".cursor"]
    sessions_subdir: acp-sessions
    is_tui: false
    protocols: [openaiv1]

  Trae:
    label: Trae
    cli_names: []
    macos_apps: ["/Applications/Trae.app"]
    windows_apps:
      - "{LOCALAPPDATA}/Programs/Trae/Trae.exe"
      - "{ProgramFiles}/Trae/Trae.exe"
    config_dirs: [".trae"]
    sessions_subdir: sessions
    is_tui: false
    protocols: [openaiv1]

  TraeCN:
    label: Trae CN
    # traecli/trae-cli 是 TUI code agent（CLI），独立安装于 ~/.local/bin 或 %LOCALAPPDATA%\trae-cli\bin\
    cli_names: [traecli, trae-cli]
    cli_tui_names: [traecli, trae-cli]
