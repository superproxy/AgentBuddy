[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentctl"
version = "3.8.5"
description = "AgentBuddy — AI 智能体配置统一 CLI 与 SDK"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]
keywords = ["ai", "agent", "cli", "llm", "mcp", "ide", "codex", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
agentctl = "agentctl.agentctl:main"

# 包目录映射：物理目录 cli/ 映射为 Python 包 agentctl
# agentctl          -> cli/         （__init__.py）
# agentctl.lib      -> cli/lib/     （__init__.py）
# agentctl.lib.ide  -> cli/lib/ide/ （__init__.py）
[tool.setuptools]
package-dir = {"agentctl" = "."}
packages = ["agentctl", "agentctl.lib", "agentctl.lib.ide"]

# 包含非 .py 数据文件（ide.yaml 等）
[tool.setuptools.package-data]
"agentctl.lib.ide" = ["*.yaml", "*.yml", "*.json"]
